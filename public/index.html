<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
</head>

<body>
    <div class="tables">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NOME</th>
                    <th>ENDEREÇO</th>
                    <th>CONTATO RESPONSVÁVEL</th>
                    <th>VALOR MENSALIDADE</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>

    </div>

    <button id="btnCadastroCliente">Cadastrar Cliente</button>

    <div id="modalCliente" class="modal">
        <div class="modal-content">
            <span id="fecharModal" class="fechar">&times;</span>

            <h2>Cadastro de Clientes</h2>

            <form id="formCliente">
                <label for="idCliente">ID:</label>
                <input type="number" id="idCliente" name="idCliente" required>

                <label for="nomeCliente">Nome:</label>
                <input type="text" id="nomeCliente" name="nomeCliente" required>

                <label for="contatoCliente">Contato:</label>
                <input type="text" id="contatoCliente" name="contatoCliente" required>

                <label for="valorContrato">Valor Contrato</label>
                <input type="number" id="valorContrato" name="valorContrato">

                <button type="submit">Salvar Cliente</button>
            </form>

            <p id="mensagem"></p>
        </div>
    </div>

        <script src="../clientes/scripts.js"></script>

</body>

</html>
